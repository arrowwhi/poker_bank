version: "2"

linters:
  enable:
    - revive
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
