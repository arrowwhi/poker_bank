version: "2"

linters:
  enable:
    - revive
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning

issues:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck