name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    # Postgres для тестов репозиториев и API (internal/repository/postgres/pgtest).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: poker_bank
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker_bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://poker:poker@localhost:5432/poker_bank?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      # tsc --noEmit + vite build
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, webapp]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o poker-bank ./cmd/poker-bank
      - uses: actions/upload-artifact@v4
        with:
          name: poker-bank
          path: poker-bank
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "http://45.129.142.96:8000/api/v1/deploy?uuid=ktny51ybdi8veuikvnofbmnj&force=false"
