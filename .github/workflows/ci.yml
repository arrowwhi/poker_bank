name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    # Postgres для тестов репозиториев и API (internal/repository/postgres/pgtest).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: poker_bank
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker_bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://poker:poker@localhost:5432/poker_bank?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      # tsc --noEmit + vite build
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, webapp]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      # Токен Coolify даёт полный доступ к серверу (деплой, секреты окружения), поэтому
      # уходит только по HTTPS. Адрес и приложение — в секретах репозитория:
      #   COOLIFY_URL       — https://<домен Coolify>, без завершающего /
      #   COOLIFY_APP_UUID  — uuid приложения poker-bank в Coolify
      #   COOLIFY_TOKEN     — API-токен с правом deploy
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          case "$COOLIFY_URL" in
            https://*) ;;
            *) echo "::error::COOLIFY_URL должен начинаться с https:// — токен не отправляется по открытому каналу"; exit 1 ;;
          esac
          if [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::не заданы секреты COOLIFY_APP_UUID / COOLIFY_TOKEN"; exit 1
          fi
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
