default:
  image: golang:1.23-alpine

stages:
  - lint
  - test
  - build

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: "-mod=mod"

cache:
  paths:
    - .go/pkg/mod/

lint:
  stage: lint
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.1.6
  script:
    - golangci-lint run ./...

test:
  stage: test
  script:
    - go test ./...

build:
  stage: build
  script:
    - CGO_ENABLED=0 go build -o poker-bank ./cmd/poker-bank
  artifacts:
    paths:
      - poker-bank
    expire_in: 1 week
  only:
    - main
    - master