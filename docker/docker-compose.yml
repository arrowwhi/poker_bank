services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poker_bank
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: kukymbr/goose-docker:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 dbname=poker_bank user=poker password=poker sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations
    command: ["up"]
    profiles:
      - dev
      - prod

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      DATABASE_URL: "postgres://poker:poker@postgres:5432/poker_bank?sslmode=disable"
    profiles:
      - prod

  bot-dev:
    image: cosmtrek/air:latest
    working_dir: /app
    volumes:
      - ..:/app
      - go_cache:/root/go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      DATABASE_URL: "postgres://poker:poker@postgres:5432/poker_bank?sslmode=disable"
    profiles:
      - dev

volumes:
  postgres_data:
  go_cache: